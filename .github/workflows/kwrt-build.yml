name: Kwrt ARMv7 自动同步构建

# 作用：定时拉取上游 xmwengxing/CFPilot 最新代码 → 叠加"我的全部功能补丁" → 测试 → 构建 ARMv7 → 发布 Release。
# 上游没更新、补丁也没改时自动跳过；补丁与上游冲突或测试不过时【不发布】、旧版本保持可用，并自动开 Issue 提醒。
# 路由器固定下载地址（cfpilot-ctl upgrade / 每周自动升级用）：
#   https://github.com/<你的账号>/<仓库>/releases/download/kwrt-latest/cfpilot-kwrt-armv7

on:
  schedule:
    - cron: '17 */6 * * *'      # 每 6 小时检查一次上游
  workflow_dispatch:
    inputs:
      force:
        description: '即使上游没更新也强制重新构建'
        type: boolean
        default: false
      upstream_ref:
        description: '上游分支/标签/提交（留空=main 最新）'
        type: string
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: kwrt-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/xmwengxing/CFPilot.git
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 计算上游版本与是否需要构建
        id: plan
        run: |
          set -euo pipefail
          REF="${{ inputs.upstream_ref }}"
          if [ -z "$REF" ]; then
            SHA=$(git ls-remote "$UPSTREAM_REPO" refs/heads/main | cut -f1)
          else
            SHA=$(git ls-remote "$UPSTREAM_REPO" "$REF" "refs/heads/$REF" "refs/tags/$REF" | head -n1 | cut -f1)
            [ -n "$SHA" ] || SHA="$REF"
          fi
          [ -n "$SHA" ] || { echo "::error::取不到上游提交"; exit 1; }
          # 补丁/安装脚本/构建脚本任一变化也要重建
          OV=$(find kwrt-overlay -type f | sort | xargs sha256sum | sha256sum | cut -c1-12)
          KEY="${SHA}-${OV}"
          OLD=$(gh release view kwrt-latest --json body -q .body 2>/dev/null | grep -o 'build-key: [0-9a-f-]*' | head -n1 | cut -d' ' -f2 || true)
          PREV=$(echo "$OLD" | cut -d- -f1)
          echo "上游：$SHA；构建标识：$KEY；上次：${OLD:-无}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          if [ "$KEY" = "$OLD" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "build=no" >> "$GITHUB_OUTPUT"; echo "无变化，跳过"
          else
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: 拉取上游源码
        if: steps.plan.outputs.build == 'yes'
        run: |
          git clone "$UPSTREAM_REPO" up
          git -C up checkout -q "${{ steps.plan.outputs.sha }}"

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.build == 'yes'
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        if: steps.plan.outputs.build == 'yes'
        with:
          go-version: '1.24'
          cache: false

      - name: 叠加补丁 → 测试 → 构建 ARMv7
        id: build
        if: steps.plan.outputs.build == 'yes'
        run: |
          set +e
          URL="https://github.com/${{ github.repository }}/releases/download/kwrt-latest/cfpilot-kwrt-armv7"
          bash kwrt-overlay/build-kwrt.sh up out "$URL" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 发布 Release
        if: steps.plan.outputs.build == 'yes' && steps.build.outputs.rc == '0'
        run: |
          set -euo pipefail
          VER=$(cat out/VERSION)                    # 例 0.42.0+78c5285
          TAG="kwrt-v${VER/+/-}"                    # 例 kwrt-v0.42.0-78c5285
          PREV="${{ steps.plan.outputs.prev }}"
          {
            echo "CFPilot 路由器版 ARMv7（$VER）"
            echo
            echo "build-key: ${{ steps.plan.outputs.key }}"
            echo
            echo "### 本次合并的上游更新"
            if [ -n "$PREV" ] && git -C up cat-file -e "$PREV^{commit}" 2>/dev/null; then
              git -C up log --format='- %s' "$PREV..${{ steps.plan.outputs.sha }}" | head -n 40
            else
              git -C up log -n 10 --format='- %s' "${{ steps.plan.outputs.sha }}"
            fi
            echo
            echo "SHA256："
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } > notes.md
          FILES="out/cfpilot-kwrt-armv7 out/cfpilot-kwrt-armv7.sha256 out/install-cfpilot-kwrt.sh out/SHA256SUMS"
          # 留档版本（可回退）
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" $FILES --title "Kwrt ARMv7 $VER" --notes-file notes.md --target "${{ github.sha }}"
          # 固定地址（路由器升级用）
          if gh release view kwrt-latest >/dev/null 2>&1; then
            gh release upload kwrt-latest $FILES --clobber
            gh release edit kwrt-latest --title "Kwrt ARMv7 最新版（$VER）" --notes-file notes.md
          else
            gh release create kwrt-latest $FILES --title "Kwrt ARMv7 最新版（$VER）" --notes-file notes.md --target "${{ github.sha }}"
          fi

      - name: 失败时开 Issue 提醒（旧版本保持可用）
        if: steps.plan.outputs.build == 'yes' && steps.build.outputs.rc != '0'
        run: |
          set -euo pipefail
          RC="${{ steps.build.outputs.rc }}"
          SHA7=$(echo "${{ steps.plan.outputs.sha }}" | cut -c1-7)
          if [ "$RC" = "2" ]; then WHY="补丁与上游最新代码冲突，需要重新对齐"; else WHY="测试或构建失败"; fi
          gh label create kwrt-sync-fail --color B60205 --description "路由器版同步失败" 2>/dev/null || true
          if [ -z "$(gh issue list --label kwrt-sync-fail --state open --json number -q '.[0].number')" ]; then
            {
              echo "上游提交 \`$SHA7\`：**$WHY**。"
              echo
              echo "已发布的 \`kwrt-latest\` 不受影响，路由器继续用旧版。把本 Issue 链接发给 Claude，让它重新对齐补丁。"
              echo
              echo "构建日志末尾："
              echo '```'
              tail -n 60 build.log
              echo '```'
            } > issue.md
            gh issue create --title "路由器版同步失败：上游 $SHA7（$WHY）" --label kwrt-sync-fail --body-file issue.md
          else
            echo "已有未关闭的同步失败 Issue，不重复创建"
          fi
          exit 1
